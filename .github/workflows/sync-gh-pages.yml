# GitHub Pages は gh-pages ブランチから配信している。main への push を gh-pages に反映する。
name: sync gh-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
